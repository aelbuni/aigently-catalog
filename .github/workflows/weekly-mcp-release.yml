name: Weekly MCP Release

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC (after weekly sync at 06:00)
  workflow_dispatch:     # Allow manual trigger

jobs:
  release:
    name: Bump version → Tag → Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version (skip if not yet published)
        id: bump
        working-directory: packages/mcp-server
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@aigently/mcp-server@$CURRENT" version >/dev/null 2>&1; then
            echo "$CURRENT is already published on npm — bumping to next patch"
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
          else
            echo "$CURRENT is not yet published — reusing it for this run (retry)"
            VERSION=$CURRENT
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (includes catalog-data copy)
        run: npm run build -w @aigently/mcp-server

      - name: Smoke test
        run: npm test -w @aigently/mcp-server

      - name: Open version-bump PR and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "aigently-bot"
          git config user.email "bot@aigently.io"

          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="bot/mcp-release-v$VERSION"

          # main is protected — land the bump via PR instead of pushing directly.
          git add packages/mcp-server/package.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — version unchanged."
          else
            git checkout -B "$BRANCH"
            git commit -m "chore(mcp-server): weekly release v$VERSION"
            git push --force-with-lease origin "$BRANCH"

            gh pr create \
              --title "chore(mcp-server): weekly release v$VERSION" \
              --body "Automated version bump for the weekly MCP release. npm publish (next step, this same run) doesn't wait on this merging." \
              --base main \
              --head "$BRANCH" \
              || true

            gh pr merge "$BRANCH" --auto --squash --delete-branch || true
          fi

          # Tags aren't branch-protected, so this can still push directly.
          git tag "mcp-server/v$VERSION" 2>/dev/null || echo "Tag already exists, skipping"
          git push origin "mcp-server/v$VERSION" 2>/dev/null || echo "Tag already pushed"

      - name: Publish to npm
        working-directory: packages/mcp-server
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
